# ---------------------------------------------------------------------------
# brand.yaml - the entire brandable surface of the platform.
#
# Specified by docs/13_DESIGN_SYSTEM.md. An operator applies their own identity
# by editing THIS FILE ONLY. No component, page, chart or report template
# carries a colour literal, a font name or a product name.
#
# How a value here reaches the screen:
#   1. lib/config.ts reads this file on the server (cached per process).
#   2. app/layout.tsx writes the token block into a <style> element on :root,
#      alongside the neutral defaults declared in app/globals.css.
#   3. Components read CSS custom properties; charts receive resolved values as
#      props through components/charts/chart-tokens.ts, because the PDF renderer
#      receives no stylesheet.
#
# WHAT DOES NOT LIVE HERE
#   - Competency colours. They are DATA: competencies.colour, seeded from
#     docs/03_COMPETENCY_FRAMEWORK.md. A rebrand of a competency is an UPDATE,
#     never an edit to a config file and never a code change.
#   - Thresholds, bands and weights. config/analytics.yaml.
#   - Anything secret. Env var names only, and none are needed here.
#
# CONTRAST IS A REQUIREMENT, NOT A PREFERENCE. Every foreground/background pair
# below must reach WCAG AA: 4.5:1 for body text, 3:1 for large text and for
# non-text indicators. contrastRatio() in components/charts/chart-tokens.ts is
# the checker; docs/13 section 7 states the pairs that must be checked.
# ---------------------------------------------------------------------------

version: "1.5"
updated: "2026-09-11"

# Colour scheme. "light" pins the interface to the light palette regardless of the viewer's OS
# setting; "auto" follows prefers-color-scheme and uses the dark set below. The Avianca demo is
# light-only: the brand is white, near-black and one red, and no dark variant exists to match.
scheme: "light"

# ---------------------------------------------------------------------------
# 1. Identity
# ---------------------------------------------------------------------------
product:
  # Rendered in the header, the browser title and every generated report header.
  # Neutral by default and deliberately descriptive rather than a brand.
  name: "Avianca Training Management System"
  short_name: "Avianca TMS"
  # Printed under the header on internal builds. Empty string hides it.
  environment_label: "DEMO"

logo:
  # Served from scaffold/public/. Leave empty to render the product's short name
  # as a text mark, which is what an operator with no asset should do rather
  # than shipping a placeholder image.
  path: "/brand/avianca-logo.png"
  alt: "Avianca"
  height_px: 28

# ---------------------------------------------------------------------------
# 2. Colour tokens
#
# Each key lands on the CSS custom property named beside it. Light values sit on
# :root; dark values are emitted inside the dark-scheme override. Nothing else
# in the platform defines these properties.
# ---------------------------------------------------------------------------
colour:
  light:
    primary: "#1B1B1B"          # --brand-primary      primary action, focused control (avianca.com --brand-primary)
    header: "#FFFFFF"           # --header             app header background (optional; defaults to primary)
    header_ink: "#131313"       # --header-ink         text drawn ON the header (optional; defaults to primary_ink)
    primary_ink: "#FFFFFF"      # --brand-primary-ink  text drawn ON primary
    accent: "#DA291C"           # --brand-accent       selected state, active tab underline (sampled from the logo)
    accent_ink: "#FFFFFF"       # --brand-accent-ink   text drawn ON accent
    surface: "#FFFFFF"          # --surface            page background
    surface_raised: "#F8F8F8"   # --surface-raised     cards, table headers (avianca.com --light-color)
    surface_sunken: "#EFEFEF"   # --surface-sunken     filter bar, code blocks
    ink: "#131313"              # --ink                body text (avianca.com --text-color)
    ink_muted: "#5A5A5A"        # --ink-muted          captions, secondary text (6.9:1 on white)
    border: "#D9D9D9"           # --border             hairlines, table rules (avianca.com disabled/border)
    border_strong: "#8A8A8A"    # --border-strong      input borders, focus ring track
  dark:
    primary: "#8FB3DA"
    primary_ink: "#0B1220"
    accent: "#E0A458"
    accent_ink: "#1A1206"
    surface: "#0B1220"
    surface_raised: "#131C2B"
    surface_sunken: "#1A2434"
    ink: "#E8EDF5"
    ink_muted: "#A6B2C4"
    border: "#2C3A50"
    border_strong: "#48586F"

# ---------------------------------------------------------------------------
# 3. State colours
#
# Used for bands, validity and outcome. They are NOT brand colours: an operator
# may retune them, but green/amber/red must stay distinguishable to a viewer with
# a colour vision deficiency, and every use is accompanied by a word or a shape.
# Colour never carries meaning alone. docs/13 section 6.
# ---------------------------------------------------------------------------
state:
  light:
    good: "#15803D"             # --state-good   (avianca.com positive is #1EA93C - 3.0:1, indicator-only; darkened for text)
    warn: "#C24A00"             # --state-warn   (avianca.com warning #EF5B06 darkened to 4.6:1)
    bad: "#C20000"              # --state-bad    (avianca.com negative)
    info: "#0B7A87"             # --state-info   (avianca.com teal #0190A0 darkened to 4.6:1)
    neutral: "#5A5A5A"          # --state-neutral
  dark:
    good: "#4ADE80"
    warn: "#FBBF24"
    bad: "#FCA5A5"
    info: "#93C5FD"
    neutral: "#94A3B8"

# ---------------------------------------------------------------------------
# 4. Grade-scale palette
#
# The grading scale itself (1-5, plus the non-scoring codes) is defined in
# docs/03_COMPETENCY_FRAMEWORK.md and config/analytics.yaml. Only its COLOURS
# live here, because they are a presentation choice.
#
# The numeral is always printed next to the swatch. A grade is never encoded by
# colour alone, on screen or in a report.
# ---------------------------------------------------------------------------
grade_palette:
  "1": { colour: "#B91C1C", label: "ineffective" }
  "2": { colour: "#B45309", label: "minimum acceptable" }
  "3": { colour: "#4D7C0F", label: "adequate" }
  "4": { colour: "#15803D", label: "effective" }
  "5": { colour: "#1D4ED8", label: "exemplary" }
# Non-scoring codes render as muted ink with the code as text. They have no
# colour of their own on purpose: they are an absence of a grade, not a value.

# ---------------------------------------------------------------------------
# 4a. Phase palette - the program builder, the instructor view and the report.
#
# Keyed by the phase codes of policy.yaml section 9. Rendered as a 3px rule
# beside a section, never as a fill: the phase is read from the label, the
# colour only helps the eye find it. A phase with no entry here renders with
# the neutral border. Emitted as --phase-<code> on :root.
# ---------------------------------------------------------------------------
phase_palette:
  brief:   { colour: "#6B7280", label: "Briefing" }
  eval:    { colour: "#1D4ED8", label: "Evaluation" }
  mt:      { colour: "#15803D", label: "Manoeuvres training" }
  sbt:     { colour: "#C2410C", label: "Scenario-based training" }
  transit: { colour: "#0E7490", label: "Transit" }
  reinf:   { colour: "#7C3AED", label: "Reinforcement" }
  debrief: { colour: "#6B7280", label: "Debriefing" }

# ---------------------------------------------------------------------------
# 5. Typography
#
# Every stack ENDS in a generic family. The PDF renderer loads no web font, and
# a report that silently falls back to a different metric reflows the layout an
# auditor signed.
# ---------------------------------------------------------------------------
font:
  # --font-sans : all interface text
  sans: '"Red Hat Display", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'
  # --font-mono : ids, external references, grades in tables, code
  mono: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace'
  # --font-display : headings. Same stack as sans by default; an operator with a
  # licensed display face changes this one line and self-hosts the file under
  # scaffold/public/fonts/.
  display: '"Red Hat Display", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'
  # Self-hosted faces, emitted as @font-face by lib/config.ts. Files under scaffold/public/fonts/.
  # Red Hat Display is SIL OFL 1.1 (LICENSE-RedHatDisplay.txt beside the files).
  faces:
    - family: "Red Hat Display"
      src: "/fonts/red-hat-display-latin-wght-normal.woff2"
      weight: "300 900"
      style: "normal"
      unicode_range: "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
    - family: "Red Hat Display"
      src: "/fonts/red-hat-display-latin-ext-wght-normal.woff2"
      weight: "300 900"
      style: "normal"
      unicode_range: "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"
    - family: "Red Hat Display"
      src: "/fonts/red-hat-display-latin-wght-italic.woff2"
      weight: "300 900"
      style: "italic"

# ---------------------------------------------------------------------------
# 6. Shape
# ---------------------------------------------------------------------------
shape:
  radius_px: 10                 # --radius   (avianca.com: generous radii, pill buttons)
  radius_small_px: 6            # --radius-sm
  # Focus ring width. Never set to 0: keyboard focus must be visible, and the
  # ring is the only affordance a keyboard user has.
  focus_ring_px: 2              # --focus-ring

# ---------------------------------------------------------------------------
# Average bands - the colour an AVERAGE grade (a mean over several grades, 1-5) is shown in:
# the pilot profile bars, and every analytics view that colours a mean. Lower bound inclusive;
# the last band is the top of the scale. Grade-by-grade colours stay in grade_palette above.
# ---------------------------------------------------------------------------
# The zones the adjusted-leniency scatter paints, read outward from zero. `to` is a MULTIPLE of
# assessor_fairness.adjusted_delta.outlier_abs in analytics.yaml - the statistical threshold stays
# there and only its presentation lives here, so moving the threshold moves the zones with it. The
# last zone carries `to: null`, meaning "everything beyond". Colours are the average-band palette, so
# a dot and a competency average of the same standing read the same way across the product.
leniency_zones:
  - { to: 0.5,  colour: "#1B7F4B", label: "In line" }            # dark green, inside half the threshold
  - { to: 1.0,  colour: "#9FD8A4", label: "Slight leaning" }     # light green, up to the threshold
  - { to: 1.5,  colour: "#F6C97A", label: "Outside the band" }   # light amber, past it
  - { to: null, colour: "#F4A3A3", label: "Well outside" }       # light red

# The diverging scale the instructor bias heatmap paints with: how far an instructor's own mean for
# a competency sits from the peer mean for that competency. `full` is the difference at which the
# tint reaches full strength, in grade points. The signed value is always printed in the cell as
# well - colour never carries the reading on its own.
residual_scale:
  lenient: "#B91C1C"        # graded above what the same pilots earned elsewhere
  strict:  "#1D4ED8"        # graded below it
  neutral: "#F1F5F9"        # at the peer mean
  full: 0.75

average_bands:
  - { from: 1.0, colour: "#F4A3A3", label: "Well below standard" }   # light red, below 1.1
  - { from: 1.1, colour: "#F6C97A", label: "Below standard" }        # light amber, 1.1 - 2.9
  - { from: 3.0, colour: "#9FD8A4", label: "Standard" }              # light green, 3.0 - 3.9
  - { from: 4.0, colour: "#2E9E5B", label: "Above standard" }        # green, 4.0 - 4.9
  - { from: 5.0, colour: "#1F3A93", label: "Exemplary" }             # dark blue, 5
